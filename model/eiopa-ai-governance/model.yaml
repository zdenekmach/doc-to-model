requirements:
  - id: R-GOV-001
    title: Implement effective governance system for AI
    priority: MUST
    description: |
      Insurance undertakings shall have in place an effective system of governance
      which provides for sound and prudent management of the business proportionate
      to the nature, scale, and complexity of operations.
    actor: A1
    source: S19
    confidence: explicit

  - id: R-GOV-002
    title: Assess risk of AI systems
    priority: MUST
    description: |
      Undertakings should assess the risk of different AI systems used, acknowledging
      varying levels of risks amongst those AI systems not prohibited or high-risk
      under the AI Act.
    actor: A1
    source: S20
    confidence: explicit

  - id: R-GOV-003
    title: Develop proportionate governance and risk management measures
    priority: MUST
    description: |
      Undertakings should develop governance and risk management measures adequate
      and proportionate to the characteristics and risks of specific AI system use.
    actor: A1
    source: S20
    confidence: explicit

  - id: R-IMP-001
    title: Conduct impact assessment for AI systems
    priority: SHOULD
    description: |
      Impact assessment should account for data processing scale, data sensitivity,
      number of customers affected, autonomy level, consumer-facing vs internal use,
      potential adverse individual impact, and insurance-specific criteria.
    actor: A1
    source: S21
    confidence: explicit
    acceptance:
      - Assessment documented and evidence maintained in writing

  - id: R-PRU-001
    title: Assess prudential considerations
    priority: SHOULD
    description: |
      Undertakings should assess prudential considerations including impact on
      business continuity, financial position, legal obligations, and reputational risks.
    actor: A1
    source: S22
    confidence: explicit

  - id: R-FAI-001
    title: Adopt customer-centric approach to AI use
    priority: SHOULD
    description: |
      Undertakings should adopt customer-centric approach to use of AI systems
      throughout entire lifecycle and value chain to ensure customers are treated
      fairly and according to best interests.
    actor: A1
    source: S33
    confidence: explicit

  - id: R-FAI-002
    title: Establish fairness and ethics policies
    priority: SHOULD
    description: |
      Undertakings should develop corporate culture documented in policies and
      procedures including ethics and fairness guidance and training for relevant staff.
    actor: A1
    source: S33
    confidence: explicit

  - id: R-FAI-003
    title: Implement bias removal in data
    priority: SHOULD
    description: |
      Undertakings should adopt sound data governance policies and make reasonable
      efforts to remove biases in data including potential unlawful proxy discriminatory
      variables.
    actor: A1
    source: S33b
    confidence: explicit

  - id: R-FAI-004
    title: Monitor AI system outcomes for bias
    priority: SHOULD
    description: |
      Outcomes of AI systems should be regularly monitored and audited including
      with use of fairness and non-discrimination metrics.
    actor: A1
    source: S35
    confidence: explicit

  - id: R-FAI-005
    title: Provide redress mechanisms for AI harms
    priority: SHOULD
    description: |
      Adequate redress mechanisms such as procedures to submit complaints should
      be in place to enable customers to access and seek redress when harmed by AI.
    actor: A1
    source: S36
    confidence: explicit

  - id: R-DAT-001
    title: Implement data governance policy for AI
    priority: SHOULD
    description: |
      Undertakings should implement data governance policy for AI systems in
      compliance with applicable insurance and data protection legislation.
    actor: A1
    source: S38
    confidence: explicit

  - id: R-DAT-002
    title: Ensure training data quality
    priority: SHOULD
    description: |
      Training and testing data should be complete (sufficient historical information),
      accurate (no material errors), and appropriate (consistent with intended use).
      Any limitations should be documented and addressed.
    actor: A1
    source: S39
    confidence: explicit

  - id: R-DAT-003
    title: Apply data governance throughout AI lifecycle
    priority: SHOULD
    description: |
      Sound data governance should be applied throughout AI system lifecycle for
      data collection, processing, and post-processing.
    actor: A1
    source: S40
    confidence: explicit

  - id: R-DAT-004
    title: Maintain same data quality standards for external data
    priority: SHOULD
    description: |
      When using external data from third parties, same data quality standards
      should apply.
    actor: A1
    source: S42
    confidence: explicit

  - id: R-DOC-001
    title: Keep records of training, testing, and methodologies
    priority: SHOULD
    description: |
      Undertakings should keep appropriate records of training and testing data
      and modeling methodologies to enable reproducibility and traceability.
    actor: A1
    source: S44
    confidence: explicit
    acceptance:
      - Records maintained and available for audit
      - Documentation of audit trails

  - id: R-TRA-001
    title: Ensure AI system outcomes are meaningfully explainable
    priority: SHOULD
    description: |
      Undertakings should ensure outcomes of AI systems can be meaningfully explained
      using various approaches such as explainable algorithms or model-agnostic tools.
    actor: A1
    source: S47
    confidence: explicit

  - id: R-TRA-002
    title: Adapt explanations to specific AI uses
    priority: SHOULD
    description: |
      Undertakings should adapt explanations to specific uses of AI systems, putting
      in place complementary risk management measures for complex systems affecting
      high-impact decisions.
    actor: A1
    source: S49
    confidence: explicit

  - id: R-TRA-003
    title: Adapt explanations to stakeholder needs
    priority: SHOULD
    description: |
      Explanations should be adapted to needs of different recipients—global and
      comprehensive for authorities and auditors, simple and clear for customers upon request.
    actor: A1
    source: S50
    confidence: explicit

  - id: R-HUM-001
    title: Implement effective internal control systems
    priority: MUST
    description: |
      Undertakings should put in place effective internal control systems during
      entire lifecycle of AI system with defined roles, responsibilities, and escalation
      procedures for relevant staff.
    actor: A1
    source: S52
    confidence: explicit

  - id: R-HUM-002
    title: Define roles and responsibilities
    priority: SHOULD
    description: |
      Roles and responsibilities should be defined for Administrative/management/supervisory
      body members, compliance and audit functions, Data Protection Officer, and actuarial
      function.
    actor: A1
    source: S52
    confidence: explicit

  - id: R-HUM-003
    title: Provide AI literacy training
    priority: SHOULD
    description: |
      Sufficient training should be provided to relevant staff adapted to their
      respective roles and responsibilities to ensure effective human oversight of AI.
    actor: A1
    source: S55
    confidence: explicit

  - id: R-HUM-004
    title: Establish guardrails for AI behavior
    priority: SHOULD
    description: |
      Human oversight should support identification and mitigation of potential biases.
      Appropriate guardrails should be established to ensure AI system functions as
      intended, respects customers' rights, and maintains high safety standard.
    actor: A1
    source: S56
    confidence: explicit

  - id: R-ACC-001
    title: Define accuracy, robustness, and cybersecurity levels
    priority: SHOULD
    description: |
      Undertakings should define levels of accuracy, robustness, and cybersecurity
      of AI systems that should perform consistently throughout lifecycle regardless
      of development source.
    actor: A1
    source: S58
    confidence: explicit

  - id: R-ACC-002
    title: Use metrics to measure AI system performance
    priority: SHOULD
    description: |
      Undertakings should use metrics to measure performance of AI systems adapted
      to the system in question to support ongoing monitoring and timely identification
      of issues such as model drift or data degradation.
    actor: A1
    source: S59
    confidence: explicit

  - id: R-ACC-003
    title: Test AI system connections via APIs
    priority: SHOULD
    description: |
      When testing AI systems, undertakings should assess potential connections to
      other AI systems via APIs since this could impact overall security and performance.
    actor: A1
    source: S61
    confidence: explicit

  - id: R-ACC-004
    title: Ensure AI system resilience against attacks
    priority: SHOULD
    description: |
      AI systems should be resilient against attempts by unauthorized third parties
      to alter use, outputs, or performance by exploiting vulnerabilities.
    actor: A1
    source: S62
    confidence: explicit

  - id: R-ACC-005
    title: Maintain IT infrastructure and fallback plans
    priority: SHOULD
    description: |
      Undertakings should have adequate and up-to-date IT infrastructure as well as
      fallback plans to ensure ICT business continuity.
    actor: A1
    source: S62
    confidence: explicit

  - id: R-TPP-001
    title: Obtain information from third-party providers
    priority: SHOULD
    description: |
      Undertakings should obtain adequate information and assurances from third-party
      service providers about AI system characteristics, capabilities, training data,
      and limitations.
    actor: A1
    source: S31
    confidence: explicit

  - id: R-TPP-002
    title: Mitigate risks from third-party IP limitations
    priority: SHOULD
    description: |
      Where implementing governance measures is difficult due to third-party IP rights,
      undertakings should mitigate risks through complementary measures, contractual
      clauses, external audits, and due diligence testing.
    actor: A1
    source: S31
    confidence: explicit

