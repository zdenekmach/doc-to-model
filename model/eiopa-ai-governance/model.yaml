id: "eiopa-ai-governance-2025"
title: "EIOPA Opinion on AI Governance and Risk Management"
subtitle: "Supervisory expectations for responsible use of AI systems in insurance"
version: "1.0.0"
status: Draft
author: EIOPA
date: "2025-08-06"
source_document: "EIOPA-BoS-25-360, 06 August 2025"
regulations:
  - "Regulation (EU) No 1094/2010"
  - "Directive (EU) 2016/97 (IDD)"
  - "Directive 2009/138/EC (Solvency II)"
  - "Regulation (EU) 2022/2554 (DORA)"
  - "Regulation (EU) 2024/1689 (AI Act)"

context: |
  EIOPA provides guidance on AI governance and risk management for insurance undertakings 
  using AI systems that are neither prohibited nor classified as high-risk under the AI Act. 
  The Opinion clarifies how existing insurance sectoral legislation applies to these systems 
  and establishes supervisory expectations for responsible AI use.

