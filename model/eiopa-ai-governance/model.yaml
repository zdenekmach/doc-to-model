requirements:
  - id: R1
    title: "Assess risk of different AI systems"
    description: |
      Undertakings must assess the risk of different AI systems used. The assessment 
      should be conducted in a manner that is proportionate to the potential impact 
      of the specific AI system on customers and on the undertaking itself. AI systems 
      with minimal anticipated impact may be subject to relatively simple assessment, 
      while those likely to have greater impact should undergo more comprehensive evaluation.
    actor: A1
    priority: MUST
    source: S20
    confidence: explicit
    acceptance:
      - "Risk assessment completed for each AI system"
      - "Assessment proportionate to identified impact level"

  - id: R2
    title: "Conduct comprehensive impact assessment"
    description: |
      Impact assessment must take into account criteria including: processing of data 
      on large scale, sensitivity of data, number of customers affected (including 
      vulnerable), extent of AI system autonomy, consumer-facing vs internal use, 
      potential adverse impact on individual rights (e.g., non-discrimination), 
      insurance-specific criteria (age-based underwriting, financial inclusion impact).
    actor: A1
    priority: MUST
    source: S21
    confidence: explicit
    acceptance:
      - "Impact assessment covers all specified criteria"
      - "Assessment documented and retained"

  - id: R3
    title: "Assess prudential considerations"
    description: |
      Undertakings must assess prudential considerations including: impact on critical 
      activities affecting business continuity, impact on financial position (claims, 
      contracts, Gross Written Premiums, solvency ratios), impact on legal obligations, 
      and reputational risks from AI system use.
    actor: A1
    priority: MUST
    source: S22
    confidence: explicit
    acceptance:
      - "Prudential impact assessment completed"

  - id: R4
    title: "Define and document AI governance approach"
    description: |
      Undertakings must define and document the approach to use of AI systems across 
      the organization, including governance and risk management measures applied 
      throughout the entire AI system lifecycle. May leverage existing Enterprise Risk 
      Management (ERM), model risk management, or Product Oversight and Governance (POG) 
      frameworks provided they reflect key principles. The approach must be regularly 
      reviewed, particularly when number, type, or materiality of AI systems changes.
    actor: A1
    priority: MUST
    source: S28
    confidence: explicit
    acceptance:
      - "AI governance policy documented"
      - "Policy implemented across organization"
      - "Regular review schedule established"

  - id: R5
    title: "Establish clear roles and responsibilities"
    description: |
      The AI governance approach must include frameworks where roles and responsibilities 
      of different staff and the interplay between them are clearly defined.
    actor: A1
    priority: SHOULD
    source: S30
    confidence: explicit
    acceptance:
      - "Roles and responsibilities documented"
      - "Staff accountability structure defined"

  - id: R6
    title: "Assume ultimate responsibility for AI systems"
    description: |
      Insurance undertakings are ultimately responsible for all AI systems they use, 
      whether developed in-house or in collaboration with third-party service providers. 
      Third-party providers must provide adequate information and assurances about 
      AI system characteristics, capabilities, training/testing data, and limitations. 
      Where implementing governance measures is challenging due to intellectual property 
      rights, undertakings must mitigate risks through complementary measures, contract 
      clauses, service level agreements, external audits, and due diligence testing.
    actor: A1
    priority: MUST
    source: S29
    confidence: explicit
    acceptance:
      - "Third-party agreements include AI governance clauses"
      - "Due diligence process established"
      - "Mitigation measures documented"

  - id: R7
    title: "Adopt customer-centric fairness and ethics approach"
    description: |
      Following a risk-based and proportionate approach, undertakings must adopt a 
      customer-centric approach to AI system use throughout entire lifecycle and value 
      chain to ensure customers are treated fairly according to their best interests. 
      Must develop corporate culture documented in policies and procedures that include 
      ethics and fairness guidance and training for relevant staff.
    actor: A1
    priority: MUST
    source: S32
    confidence: explicit
    acceptance:
      - "Fairness and ethics policies documented"
      - "Staff training completed"
      - "Customer-centric approach embedded"

  - id: R8
    title: "Monitor and audit AI system outcomes"
    description: |
      Outcomes of AI systems must be regularly monitored and, where appropriate, audited, 
      including through use of fairness and non-discrimination metrics.
    actor: A1
    priority: MUST
    source: S35
    confidence: explicit
    acceptance:
      - "Monitoring schedule established"
      - "Metrics defined and tracked"
      - "Audit findings documented"

  - id: R9
    title: "Ensure data governance throughout AI lifecycle"
    description: |
      Undertakings must implement data governance policy for AI systems in compliance 
      with insurance and data protection legislation. Data used for training and testing 
      must be complete (sufficient historical information), accurate (no material errors), 
      and appropriate (consistent with intended purposes). Sound data governance must 
      apply throughout the entire AI system lifecycle for data collection, processing, 
      and post-processing. Undertakings must make reasonable efforts to remove biases 
      in data in line with policy.
    actor: A1
    priority: MUST
    source: S21
    confidence: derived
    acceptance:
      - "Data governance policy implemented"
      - "Data quality standards established"
      - "Bias mitigation efforts documented"

open_questions:
  - "What specific fairness and non-discrimination metrics should be used? (Annex I provides examples but selection criteria unclear)"
  - "How should explainability be adapted for different stakeholder types in practice?"
  - "What constitutes 'material error' in data quality standards?"
  - "How frequently should AI system governance approaches be reviewed (annual, event-driven, continuous)?"
  - "What documentation of bias removal efforts is sufficient?"
