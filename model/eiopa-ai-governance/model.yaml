id: EIOPA-AI-2025
title: Opinion on AI Governance and Risk Management
subtitle: EIOPA-BoS-25-360
version: "1.0.0"
status: Draft
author: European Insurance and Occupational Pensions Authority
date: "2025-08-06"
source_document: inputs/eiopa-ai-governance-2025.txt
regulations:
  - Regulation (EU) No 1094/2010
  - Directive (EU) 2016/97 (Insurance Distribution Directive)
  - Directive 2009/138/EC (Solvency II Directive)
  - Regulation (EU) 2022/2554 (Digital Operational Resilience Act)
  - Commission Delegated Regulation 2015/35
  - Commission Delegated Regulation 2017/2358
  - Regulation (EU) 2024/1689 (AI Act)

context: >
  This Opinion provides guidance on AI governance and risk management for insurance undertakings.
  It addresses the use of AI systems throughout the insurance value chain (pricing, underwriting,
  claims management, fraud detection) while respecting the principle of proportionality.
  The Opinion covers AI systems that are not prohibited or considered high-risk under the AI Act.

