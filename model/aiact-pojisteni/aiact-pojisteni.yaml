claims:
  - id: T-01
    title: "Posuzování rizik a stanovování cen u životního a zdravotního pojištění je vysoce rizikové použití AI"
    description: >
      Příloha III bod 5 písm. c) uvádí systémy AI určené k použití za účelem
      posuzování rizik a stanovování cen ve vztahu k fyzickým osobám v případě
      životního a zdravotního pojištění. Podle čl. 6 odst. 2 jsou systémy
      uvedené v příloze III považovány za vysoce rizikové.
    claim_type: fakt
    basis: "Příloha III bod 5 písm. c) ve spojení s čl. 6 odst. 2."
    subject: "Systém AI pro posuzování rizik a stanovování cen u životního a zdravotního pojištění"
    predicate: "klasifikace rizika"
    value: "vysoce rizikový"
    scope: "životní a zdravotní pojištění, fyzické osoby"
    source: S15
    confidence: explicit

  - id: T-02
    title: "Systém z přílohy III se vždy považuje za vysoce rizikový, pokud provádí profilování fyzických osob"
    description: >
      Bez ohledu na výjimky v čl. 6 odst. 3 se systém AI uvedený v příloze III
      za vysoce rizikový považuje vždy, pokud provádí profilování fyzických osob.
    claim_type: fakt
    basis: "Článek 6 odst. 3, poslední pododstavec."
    subject: "Systém AI uvedený v příloze III provádějící profilování"
    predicate: "klasifikace rizika"
    value: "vždy vysoce rizikový"
    condition: "provádí profilování fyzických osob"
