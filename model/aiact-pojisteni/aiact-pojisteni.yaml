id: RS-AIACT-POJ-001
title: "AI Act v pojišťovnictví — povinnosti pojišťovny jako zavádějícího subjektu"
subtitle: "Výřez nařízení (EU) 2024/1689 pro posuzování rizik a stanovování cen u životního a zdravotního pojištění"
version: "0.1.0"
status: Draft
author: "Analytik"
date: "2026-08-01"
source_document: "inputs/aiact-pojisteni.md"
regulations:
  - "Nařízení (EU) 2024/1689 — akt o umělé inteligenci (AI Act)"
  - "Nařízení (EU) 2016/679 (GDPR) — odkazováno u posouzení vlivu na ochranu osobních údajů"
  - "Směrnice 2009/138/ES (Solventnost II) — odkazováno u režimu pro pojišťovny"

context: >
  Systémy AI určené k posuzování rizik a stanovování cen ve vztahu k fyzickým
  osobám u životního a zdravotního pojištění jsou podle přílohy III bodu 5
  písm. c) vysoce rizikové. Pojišťovna, která takový systém nasadí, je
  zavádějícím subjektem a nese vlastní sadu povinností nezávisle na tom, co
  splnil dodavatel systému. Nejtvrdší z nich je posouzení dopadu na základní
  práva podle článku 27, které se na provozovatele systémů z přílohy III bodu 5
  písm. b) a c) vztahuje jmenovitě. Model zachycuje jen povinnosti plynoucí
  z tohoto výřezu, ne z celého nařízení.

# ─────────────────────────────────────────────────────────────────────────
scope_in:
  - "Povinnosti zavádějícího subjektu při nasazení vysoce rizikového systému AI."
  - "Klasifikace systémů pro posuzování rizik a stanovování cen u životního a zdravotního pojištění."
  - "Posouzení dopadu na základní práva podle článku 27."
  - "Úlevy pro finanční instituce plynoucí z práva Unie o finančních službách."

scope_out:
  - "Povinnosti poskytovatele systému AI (kapitola III oddíl 2 mimo výřez)."
  - "Sankce za porušení nařízení — výřez neobsahuje článek 99."
  - "Definice pojmů podle článku 3 — výřez je neobsahuje."
  - "Systémy rozpoznávání emocí, biometrická kategorizace a deep fake (čl. 50 odst. 3 a 4) — pro stanovování cen nejsou relevantní."
  - "Následná biometrická identifikace na dálku (čl. 26 odst. 10) — jiná oblast použití."
  - "Povinnost informovat zástupce zaměstnanců (čl. 26 odst. 7) — týká se použití na pracovišti, ne stanovování cen."

