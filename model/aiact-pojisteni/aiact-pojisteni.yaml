  - id: T-04
    title: "Posuzování rizik a cen může vést k finančnímu vyloučení a diskriminaci"
    description: >
      Recitál 58 uvádí, že systémy AI pro posuzování rizik a stanovování cen ve
      vztahu k fyzickým osobám pro účely zdravotního a životního pojištění mohou
