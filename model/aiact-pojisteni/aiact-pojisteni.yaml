  - id: T-03
    title: "Systémy pro výpočet kapitálových požadavků pojišťoven se za vysoce rizikové nepovažují"
    description: >
      Recitál 58 uvádí, že systémy AI stanovené právem Unie pro účely odhalování
      podvodů při nabízení finančních služeb a pro účely obezřetnosti za účelem
      výpočtu kapitálových požadavků úvěrových institucí a pojišťoven by neměly
