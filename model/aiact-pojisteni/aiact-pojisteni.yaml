      Pokud během použití systému zavádějící subjekt posoudí, že se některý
      z prvků posouzení změnil nebo již není aktuální, přijme nezbytné kroky
      k aktualizaci těchto informací.
    priority: MUST
    acceptance:
      - "Změna nebo neaktuálnost některého prvku vede k aktualizaci posouzení."
