requirements:
  - id: FR-01
    title: "Provést posouzení dopadu na základní práva před zavedením systému"
    description: >
      Před zavedením vysoce rizikového systému AI podle čl. 6 odst. 2 provedou
      zavádějící subjekty provozující systémy uvedené v příloze III bodě 5
      písm. b) a c) posouzení dopadu na základní práva, který může použití
      takového systému mít.
    priority: MUST
    acceptance:
      - "Posouzení je provedeno před prvním použitím systému."
      - "Posouzení obsahuje popis procesů zavádějícího subjektu, v nichž bude systém používán."
      - "Posouzení obsahuje popis časového období a frekvence plánovaného použití."
      - "Posouzení obsahuje kategorie fyzických osob a skupin, které mohou být dotčeny."
      - "Posouzení obsahuje specifická rizika újmy pro tyto kategorie osob."
      - "Posouzení obsahuje popis provádění opatření lidského dohledu."
      - "Posouzení obsahuje opatření, která mají být přijata v případě naplnění rizik, včetně opatření pro vnitřní správu a mechanismy vyřizování stížností."
    actor: A-ZAV
    justified_by: [T-01, T-04, T-08]
    source: S11
    confidence: explicit

  - id: FR-02
    title: "Informovat orgán dozoru nad trhem o výsledku posouzení"
    description: >
      Po provedení posouzení zavádějící subjekt informuje o jeho výsledcích orgán
      dozoru nad trhem prostřednictvím vyplněného dotazníku.
    priority: MUST
    acceptance:
      - "Orgán dozoru nad trhem je informován prostřednictvím vyplněného dotazníku."
    actor: A-ZAV
    justified_by: [T-01]
