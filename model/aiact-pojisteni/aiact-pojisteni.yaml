    description: >
      Zjistí-li zavádějící subjekty závažný incident, neprodleně o tomto
      incidentu informují nejprve poskytovatele a poté dovozce nebo distributora
      a příslušné orgány dozoru nad trhem.
    priority: MUST
    acceptance:
      - "Informován je nejprve poskytovatel, poté dovozce nebo distributor a orgány dozoru nad trhem."
    actor: A-ZAV
    source: S10
    confidence: explicit

  - id: FR-11
    title: "Uchovávat protokoly generované systémem"
    description: >
      Subjekty zavádějící vysoce rizikové systémy AI uchovávají protokoly
      automaticky generované systémem v rozsahu, v jakém jsou pod jejich
      kontrolou, po dobu odpovídající zamýšlenému účelu systému, jež není kratší
      než šest měsíců. Zavádějící subjekty, které jsou finančními institucemi,
      uchovávají protokoly jako součást dokumentace vedené podle příslušného
      práva Unie v oblasti finančních služeb.
    priority: MUST
    acceptance:
      - "Doba uchování protokolů není kratší než šest měsíců."
      - "U finanční instituce jsou protokoly součástí dokumentace podle práva Unie o finančních službách."
    actor: A-ZAV
    justified_by: [T-07]
    source: S10
    confidence: explicit

  - id: FR-12
    title: "Informovat fyzické osoby, že jsou vystaveny použití systému"
    description: >
      Subjekty zavádějící vysoce rizikové systémy AI uvedené v příloze III, které
      přijímají rozhodnutí nebo pomáhají při přijímání rozhodnutí týkajících se
      fyzických osob, tyto fyzické osoby informují, že jsou použití vysoce
      rizikového systému AI vystaveny.
    priority: MUST
    actor: A-ZAV
    justified_by: [T-01]
    source: S10
    confidence: explicit

  - id: FR-13
    title: "Použít informace od poskytovatele pro posouzení vlivu na ochranu osobních údajů"
    description: >
      Subjekty zavádějící vysoce rizikové systémy AI v příslušných případech
      použijí informace poskytnuté podle článku 13 ke splnění své povinnosti
      provést posouzení vlivu na ochranu osobních údajů podle článku 35 nařízení
      (EU) 2016/679.
    priority: MUST
    actor: A-ZAV
    justified_by: [T-09]
    source: S10
    confidence: explicit

  - id: FR-14
    title: "Spolupracovat s příslušnými orgány"
    description: >
      Zavádějící subjekty spolupracují s příslušnými orgány na veškerých
      opatřeních, která tyto orgány v souvislosti s vysoce rizikovým systémem AI
      přijmou za účelem provádění tohoto nařízení.
    priority: MUST
    actor: A-ZAV
    source: S10
    confidence: explicit

# ─────────────────────────────────────────────────────────────────────────
quality_requirements:
  - id: NFR-01
    category: "Auditovatelnost"
    requirement: >
      Protokoly automaticky generované systémem musí být uchovány po dobu, jež
      není kratší než šest měsíců, a u finanční instituce vedeny jako součást
      dokumentace podle práva Unie o finančních službách.
    source: S10
    confidence: explicit

  - id: NFR-02
    category: "Vysvětlitelnost"
    requirement: >
      Fungování systému musí být dostatečně transparentní, aby zavádějícímu
      subjektu umožnilo interpretovat výstup systému a vhodně jej používat.
    source: S7
    confidence: explicit

  - id: NFR-03
    category: "Ovladatelnost"
    requirement: >
      Osoby pověřené dohledem musí mít možnost rozhodnout, že výstup systému
      nezohlední, zruší nebo zvrátí, a zasáhnout do fungování systému nebo jej
      přerušit tlačítkem stop či podobným postupem, který umožní systém zastavit
      v bezpečném módu.
    source: S9
    confidence: explicit

# ─────────────────────────────────────────────────────────────────────────
entities:
  - id: E-FRIA
    name: "Posouzení dopadu na základní práva"
    description: >
      Obsah posouzení podle čl. 27 odst. 1. Šest povinných částí — model je vede
      jako pole, protože podle nich se dá zkontrolovat úplnost hotového posouzení.
    fields:
      - name: "popis_procesu"
        type: "text"
        required_field: true
        note: "Procesy zavádějícího subjektu, v nichž bude systém používán v souladu se zamýšleným účelem."
      - name: "obdobi_a_frekvence"
        type: "text"
        required_field: true
        note: "Časové období a frekvence plánovaného použití každého ze systémů."
      - name: "dotcene_kategorie_osob"
        type: "text"
        required_field: true
        note: "Kategorie fyzických osob a skupin, které by mohly být použitím dotčeny."
      - name: "specificka_rizika_ujmy"
        type: "text"
        required_field: true
        note: "Rizika újmy pro určené kategorie osob, při zohlednění informací od poskytovatele podle článku 13."
      - name: "opatreni_lidskeho_dohledu"
        type: "text"
        required_field: true
        note: "Popis provádění opatření lidského dohledu v souladu s návodem k použití."
      - name: "opatreni_pri_naplneni_rizik"
        type: "text"
        required_field: true
        note: "Opatření při naplnění rizik, včetně vnitřní správy a mechanismů vyřizování stížností."

# ─────────────────────────────────────────────────────────────────────────
# PROCES — jen to, co výřez opravdu popisuje jako sled. Článek 27 určuje,
# co je před zavedením, co po posouzení a kdy se posouzení opakuje.
# ─────────────────────────────────────────────────────────────────────────
process:
  name: "Zavedení vysoce rizikového systému AI do provozu pojišťovny"
  steps:
    - id: P0
      type: start
      label: "Záměr nasadit systém AI"
      actor: A-ZAV
      next: P1
      source: S11
    - id: P1
      type: decision
      label: "Spadá systém do přílohy III bodu 5?"
      actor: A-ZAV
      source: S15
      branches:
        - label: "ano"
          target: P2
        - label: "ne"
          target: P6
    - id: P2
      type: task
      label: "Proveď posouzení dopadu na základní práva"
      actor: A-ZAV
      next: P3
      source: S11
    - id: P3
      type: task
      label: "Informuj orgán dozoru nad trhem vyplněným dotazníkem"
      actor: A-ZAV
      next: P4
      source: S11
    - id: P4
      type: task
      label: "Pověř lidským dohledem způsobilé osoby"
      actor: A-ZAV
      next: P5
      source: S10
    - id: P5
      type: task
      label: "Uveď systém do provozu a monitoruj jej"
      actor: A-ZAV
      next: P7
      source: S10
    - id: P6
      type: end
      label: "Mimo rozsah tohoto posouzení"
      actor: A-ZAV
      source: S15
    - id: P7
      type: decision
      label: "Změnil se některý prvek posouzení?"
      actor: A-ZAV
      source: S11
      branches:
        - label: "ano"
          target: P2
        - label: "ne"
          target: P8
    - id: P8
      type: end
      label: "Provoz pokračuje beze změny"
      actor: A-ZAV
      source: S11

# ─────────────────────────────────────────────────────────────────────────
risks:
  - id: R-01
    description: >
      Systém pro posuzování rizik a stanovování cen může porušovat základní práva
      dotčených osob a mít závažné důsledky pro jejich život a zdraví, včetně
      finančního vyloučení a diskriminace.
    mitigation: "Posouzení dopadu na základní práva podle článku 27 a opatření z něj plynoucí."
    source: S2
  - id: R-02
    description: >
      Osoba pověřená dohledem se může nadměrně spolehnout na výstup systému —
      zkreslení způsobené automatizací.
    mitigation: "Osoby pověřené dohledem si tuto tendenci nadále uvědomují (čl. 14 odst. 4 písm. b))."
    source: S9
  - id: R-03
    description: >
      Systémy AI mohou fixovat historické vzorce diskriminace, například na
      základě rasového nebo etnického původu, genderu, zdravotního postižení,
      věku a sexuální orientace, nebo vytvářet nové formy diskriminačních dopadů.
    mitigation: "Zajištění relevance a reprezentativnosti vstupních dat v rozsahu kontroly zavádějícího subjektu."
    source: S2

# ─────────────────────────────────────────────────────────────────────────
# OTEVŘENÉ OTÁZKY — co výřez neodpovídá. Nejde o chyby extrakce, jde
# o nálezy o dokumentu. Tahle sekce je při předání obvykle nejužitečnější.
# ─────────────────────────────────────────────────────────────────────────
open_questions:
  - "Výřez neobsahuje článek 3 s definicemi. Kdo přesně je zavádějícím subjektem, poskytovatelem a co je uvedení do provozu, z něj nejde ověřit."
  - "Výřez neobsahuje sankční ustanovení (článek 99). Není zřejmé, čím je porušení kterékoli z povinností postiženo."
  - "Vzor dotazníku pro oznámení výsledku posouzení má teprve vypracovat úřad pro AI. Výřez neuvádí, do kdy — do té doby není jasné, jakou formou se povinnost podle FR-02 plní."
  - "Není uvedena lhůta, do kdy má být orgán dozoru nad trhem informován po provedení posouzení."
  - "Není definován závažný incident ani lhůta neprodleně u FR-10. Obojí je v článku 3, který ve výřezu není."
  - "Recitál 58 vylučuje z vysokého rizika systémy pro obezřetnostní výpočet kapitálových požadavků, ale text článku ani přílohy III to neopakuje. Není jisté, jak se hranice uplatní u systému, který slouží zároveň pricingu i kapitálovému výpočtu."
  - "Článek 6 odst. 3 umožňuje výjimku z vysokého rizika, ale výřez neobsahuje článek 49 odst. 2 o registraci ani pokyny Komise, které měly vyjít do 2. února 2026. Postup pro uplatnění výjimky tedy nejde z výřezu sestavit."
  - "Není zřejmé, zda posouzení dopadu na základní práva provádí pojišťovna pro každý systém zvlášť, nebo může vycházet z dřívějšího posouzení. Článek 27 odst. 2 to připouští v podobných případech, ale co je podobný případ, nedefinuje."
  - "Výřez neobsahuje přechodná ustanovení ani datum použitelnosti povinností pro vysoce rizikové systémy z přílohy III."
  - "Není zřejmé, kdo v pojišťovně je vlastníkem povinnosti — nařízení ukládá povinnosti právnické osobě, ne roli. Rozdělení mezi útvary je věcí interního rozhodnutí, ne předpisu."
  - "Vztah k posouzení vlivu na ochranu osobních údajů podle GDPR je popsán jako doplnění (čl. 27 odst. 4), ale výřez neříká, které části se smí převzít a které je nutné zpracovat zvlášť."
